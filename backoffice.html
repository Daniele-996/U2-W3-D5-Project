  <body>

      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

              ></path>
              <path
                d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"
              ></path>
            </svg>
            My Shop</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="./index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="./backoffice.html">Backoffice</a>
              </li>
            </ul>
            <div class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"> Carrello </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">I tuoi articoli</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="#">1</a></li>

        </div>
      </nav>
    </header>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-6">
          <h1>Backoffice</h1>
          <div class="col-12">
            <form role="search">
              <div>
                <label for="name" class="form-control bg-info-subtle">Name</label>
                <input id="name" class="form-control me-2 my-1" type="text" placeholder="Search" aria-label="Search" required />
              </div>
              <div>
                <label for="description" class="form-control bg-info-subtle">Description</label>
                <input id="description" class="form-control me-2 my-1" type="text" placeholder="Search" aria-label="Search" required />
              </div>
              <div>
                <label for="brand" class="form-control bg-info-subtle">Brand</label>
                <input id="brand" class="form-control me-2 my-1" type="text" placeholder="Search" aria-label="Search" required />
              </div>
              <div>
                <label for="imageUrl" class="form-control bg-info-subtle">Url</label>
                <input id="imageUrl" class="form-control me-2 my-1" type="url" placeholder="Search" aria-label="Search" required />
              </div>
              <div>
                <label for="price" class="form-control bg-info-subtle">Price</label>
                <input id="price" class="form-control me-2 my-1" type="number" placeholder="Search" aria-label="Search" required />
              </div>
              <div>
                <button class="btn btn-success" type="submit">Add new article</button>
                <button class="btn btn-danger" type="submit">Delete article</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
